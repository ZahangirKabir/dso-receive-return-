<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Collection Management with Dynamic DSO</title>
  <!-- SheetJS CDN for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2, h3 { color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    .dso-input-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .dso-input-row input { flex: 1; }
    .btn-add { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-remove { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-submit { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
    th { background-color: #007bff; color: white; }
    
    .bg-received { background-color: #e2f0d9; }
    .bg-return { background-color: #fce4d6; }
    .bg-diff { background-color: #fff2cc; }
    .dso-badge { display: inline-block; background: #e9ecef; border: 1px solid #ced4da; border-radius: 4px; padding: 2px 6px; margin: 2px; font-size: 12px; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    .btn-export { background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>DSO Collection Form</h2>
    <form id="collectionForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="entryDate">Date:</label>
        <input type="date" id="entryDate" required>
      </div>

      <div class="form-group">
        <label for="entryMonth">Month:</label>
        <input type="text" id="entryMonth" placeholder="e.g. July 2026" required>
      </div>

      <div class="form-group">
        <label>DSO Received (Dynamic Entries):</label>
        <div id="dsoContainer">
          <!-- Default Row 1 -->
          <div class="dso-input-row">
            <input type="text" class="dso-id" placeholder="DSO ID (e.g. 801)" required>
            <input type="number" class="dso-amount" placeholder="Amount (৳)" required>
            <button type="button" class="btn-remove" onclick="removeDsoRow(this)">X</button>
          </div>
        </div>
        <button type="button" class="btn-add" onclick="addDsoRow()">➕ Add More DSO</button>
      </div>

      <div class="form-group">
        <label for="emReceived">EM Received Amount (৳):</label>
        <input type="number" id="emReceived" value="0">
      </div>

      <div class="form-group">
        <label for="cashReceived">Cash Received Amount (৳):</label>
        <input type="number" id="cashReceived" value="0">
      </div>

      <button type="submit" class="btn-submit">Submit Record</button>
    </form>
  </div>

  <div class="container">
    <h3>Admin Data View</h3>
    <button class="btn-export" onclick="exportToExcel()">Export to Excel</button>
    <div style="overflow-x:auto;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Month</th>
            <th>DSO IDs & Amounts</th>
            <th>EM Rec</th>
            <th>Cash Rec</th>
            <th>DSO Rec (Total)</th>
            <th>Total Received</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Data Rows will be dynamically rendered here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Sample In-Memory Database / State
    let collectionsData = {};

    // 1. Dynamic DSO Row Addition
    function addDsoRow() {
      const container = document.getElementById("dsoContainer");
      const row = document.createElement("div");
      row.className = "dso-input-row";
      row.innerHTML = `
        <input type="text" class="dso-id" placeholder="DSO ID" required>
        <input type="number" class="dso-amount" placeholder="Amount (৳)" required>
        <button type="button" class="btn-remove" onclick="removeDsoRow(this)">X</button>
      `;
      container.appendChild(row);
    }

    // 2. Remove Dynamic Row
    function removeDsoRow(btn) {
      const container = document.getElementById("dsoContainer");
      if (container.children.length > 1) {
        btn.parentElement.remove();
      } else {
        alert("কমপক্ষে একটি DSO ID থাকতে হবে।");
      }
    }

    // Helper functions
    function parseRawNumber(val) {
      const num = parseFloat(val);
      return isNaN(num) ? 0 : num;
    }

    function formatBD(num) {
      return num.toLocaleString('en-IN');
    }

    // 3. Form Submit Handler
    function handleFormSubmit(e) {
      e.preventDefault();

      const date = document.getElementById("entryDate").value;
      const month = document.getElementById("entryMonth").value;
      const emReceived = document.getElementById("emReceived").value;
      const cashReceived = document.getElementById("cashReceived").value;

      // Extract all DSO rows data
      const dsoRows = document.querySelectorAll("#dsoContainer .dso-input-row");
      const dsoList = [];

      dsoRows.forEach(row => {
        const id = row.querySelector(".dso-id").value;
        const amount = row.querySelector(".dso-amount").value;
        if (id && amount) {
          dsoList.push({ id: id, amount: amount });
        }
      });

      const key = "rec_" + Date.now();
      collectionsData[key] = {
        date: date,
        month: month,
        dsoList: dsoList,
        emReceived: emReceived,
        cashReceived: cashReceived
      };

      // Reset Form
      document.getElementById("collectionForm").reset();
      document.getElementById("dsoContainer").innerHTML = `
        <div class="dso-input-row">
          <input type="text" class="dso-id" placeholder="DSO ID (e.g. 801)" required>
          <input type="number" class="dso-amount" placeholder="Amount (৳)" required>
          <button type="button" class="btn-remove" onclick="removeDsoRow(this)">X</button>
        </div>
      `;

      // Render Table
      renderAdminTable(collectionsData);
    }

    // 4. Render Admin Table
    function renderAdminTable(data) {
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      if (!data || Object.keys(data).length === 0) {
        tbody.innerHTML = `<tr><td colspan="8">কোন রেকর্ড পাওয়া যায়নি।</td></tr>`;
        return;
      }

      Object.keys(data).forEach(key => {
        const item = data[key];

        const emRec = parseRawNumber(item.emReceived);
        const cashRec = parseRawNumber(item.cashReceived);

        // Calculate Multiple DSO Amounts
        let dsoRecSum = 0;
        let dsoBadgesHtml = "";

        if (Array.isArray(item.dsoList)) {
          item.dsoList.forEach(dso => {
            const amt = parseRawNumber(dso.amount);
            dsoRecSum += amt;
            dsoBadgesHtml += `<span class="dso-badge"><strong>${dso.id}:</strong> ৳${formatBD(amt)}</span> `;
          });
        } else {
          dsoRecSum = parseRawNumber(item.dsoReceived);
          dsoBadgesHtml = item.userId || '-';
        }

        const totRec = emRec + cashRec + dsoRecSum;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.date || ''}</td>
          <td>${item.month || ''}</td>
          <td>${dsoBadgesHtml || '-'}</td>
          <td>৳ ${formatBD(emRec)}</td>
          <td>৳ ${formatBD(cashRec)}</td>
          <td><strong>৳ ${formatBD(dsoRecSum)}</strong></td>
          <td class="bg-received"><strong>৳ ${formatBD(totRec)}</strong></td>
          <td><button class="btn-delete" onclick="deleteEntry('${key}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 5. Delete Entry Function
    function deleteEntry(key) {
      if (confirm("আপনি কি নিশ্চিত যে এই রেকর্ডটি ডিলিট করতে চান?")) {
        delete collectionsData[key];
        renderAdminTable(collectionsData);
      }
    }

    // 6. Export to Excel
    function exportToExcel() {
      const table = document.getElementById("dataTable");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Collections" });
      XLSX.writeFile(wb, `Collection_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    }
  </script>
</body>
</html>
