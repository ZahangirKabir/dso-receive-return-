<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Name & Slip OCR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="file"], select {
      width: 300px;
      padding: 8px;
      font-size: 14px;
    }
    .status {
      font-size: 12px;
      color: #007bff;
      margin-top: 5px;
    }
  </style>
  <!-- OCR-এর জন্য Tesseract.js লাইব্রেরি -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <h2>ব্যাংক ইনফরমেশন</h2>

  <!-- ব্যাংক নেম এর জন্য আলাদা ফিল্ড -->
  <div class="form-group">
    <label for="bankName">Bank Name:</label>
    <input type="text" id="bankName" name="bankName" placeholder="ব্যাংকের নাম প্রবেশ করান বা স্লিপ আপলোড করুন">
  </div>

  <!-- ব্যাংক স্লিপ ফাইল ইনপুট -->
  <div class="form-group">
    <label for="bankSlip">Upload Bank Slip:</label>
    <input type="file" id="bankSlip" accept="image/*" onchange="extractBankName(event)">
    <div id="status" class="status"></div>
  </div>

  <script>
    // বাংলাদেশ ও আন্তর্জাতিক পরিচিত ব্যাংকগুলোর তালিকা (Keyword Mapping)
    const knownBanks = [
      "Islami Bank", "Dutch-Bangla Bank", "DBBL", "BRAC Bank", "City Bank", 
      "Eastern Bank", "EBL", "United Commercial Bank", "UCB", "Sonali Bank", 
      "Janata Bank", "Agrani Bank", "Rupali Bank", "Pubali Bank", "Standard Chartered",
      "HSBC", "Prime Bank", "Dhaka Bank", "Mutual Trust Bank", "MTB", "Southeast Bank"
    ];

    async function extractBankName(event) {
      const file = event.target.files[0];
      const statusElement = document.getElementById('status');
      const bankInput = document.getElementById('bankName');

      if (!file) return;

      statusElement.innerText = 'স্লিপ প্রসেস হচ্ছে... (অনুগ্রহ করে অপেক্ষা করুন)';
      
      try {
        // Tesseract.js দিয়ে ইমেজ থেকে টেক্সট রিড করা
        const result = await Tesseract.recognize(file, 'eng');
        const extractedText = result.data.text;
        
        console.log("Extracted Text:", extractedText);

        // টেক্সট থেকে ব্যাংক নেম ম্যাচ করানো
        let matchedBank = "";
        for (let bank of knownBanks) {
          const regex = new RegExp(`\\b${bank}\\b`, 'i');
          if (regex.test(extractedText)) {
            matchedBank = bank;
            break;
          }
        }

        if (matchedBank) {
          bankInput.value = matchedBank;
          statusElement.innerText = `সফলভাবে স্কেল করা হয়েছে! অটোমেটিক ব্যাংক বসানো হয়েছে: ${matchedBank}`;
        } else {
          statusElement.innerText = 'স্লিপ থেকে ব্যাংকের নাম স্পষ্ট পাওয়া যায়নি। মানুয়ালি ব্যাংকের নাম লিখুন।';
        }
      } catch (error) {
        console.error(error);
        statusElement.innerText = 'ফাইল রিড করতে সমস্যা হয়েছে।';
      }
    }
  </script>

</body>
</html>
