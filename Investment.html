 return input;
};

// All Investment form, Working Capital reports and Petty Cash accounting live here.
(()=>{'use strict';
let bridge;
try{bridge=parent!==window && parent.location.origin===location.origin && parent.portalInvestmentContext;}catch(_){bridge=null;}
const preview=!bridge?.database || !bridge.getUser();
if(preview)bridge={database:null,getUser:()=>null,serverTimestamp:null};
const owner=preview?'preview':String(bridge.getUser());
const database=bridge.database,menu=document.getElementById('menu'),content=document.getElementById('content');
document.getElementById('access').hidden=true;document.getElementById('app').hidden=false;
const banks=['Islami','Pubali','City','DBBL','Agroni','UCB','Sonali'];
const pages=[['capital','Daily Working Capital'],['capitalReport','Working Capital Report'],['petty','Daily Petty Cash'],['pettyReport','Daily Petty Cash Report'],['total','Total Investment']];
let page='capital',items={},stream=null,handler=null,dataReady=false;
const node=(tag,label)=>{const x=document.createElement(tag);if(label!==undefined)x.textContent=String(label);return x;};
const money=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const inputMoney=n=>Number(n||0)===0?'':money(n);
function today(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=key=>parts.find(x=>x.type===key).value;return `${part('year')}-${part('month')}-${part('day')}`;}
function stop(){if(stream){stream.off('value',handler);stream=null;handler=null;}}
function field(area,label,name,type='number',required=false){
 const box=node('div');box.className='field';box.append(node('label',label));const input=window.prepareInvestmentTestInput(node('input'));input.name=name;input.type=type==='number'?'text':type;input.required=required;
 if(type==='number'){input.inputMode='decimal';input.addEventListener('blur',()=>{if(input.value.trim()){try{input.value=inputMoney(amount(input.value));}catch{input.setCustomValidity('সঠিক টাকার অঙ্ক লিখুন।');input.reportValidity();}}});input.addEventListener('input',()=>input.setCustomValidity(''));}
 if(type==='date')input.value=today();box.append(input);area.append(box);return input;
}
function select(area,label,name,options){
 const box=node('div');box.className='field';box.append(node('label',label));const x=node('select');x.name=name;x.required=true;
 options.forEach(([value,caption])=>{const o=node('option',caption);o.value=value;x.append(o);});box.append(x);area.append(box);return x;
}
function section(form,title){const wrap=node('fieldset');wrap.className='finance-section';if(title!=='Date')wrap.append(node('legend',title));else wrap.classList.add('date-selection-section');const grid=node('div');grid.className='fields';wrap.append(grid);form.append(wrap);return grid;}
function baseFields(form){const grid=section(form,'Date');field(grid,'Date','date','date',true);return grid;}
function bankFields(form,prefix,title){const grid=section(form,title);banks.forEach(bank=>field(grid,bank,`${prefix}_${bank}`));return grid;}
function repeatRows(form,title,createRow){const grid=section(form,title),wrap=grid.parentElement;grid.remove();const rows=node('div');wrap.append(rows);const add=node('button','+ Add More');add.type='button';add.className='add-row';wrap.append(add);
 const append=()=>{const row=node('div');row.className='fields repeat-row';createRow(row);const remove=node('button','Remove');remove.type='button';remove.className='add-row';remove.onclick=()=>{if(rows.children.length>1){row.remove();wrap.dispatchEvent(new Event('input',{bubbles:true}));}};row.append(remove);rows.append(row);wrap.dispatchEvent(new Event('input',{bubbles:true}));};add.onclick=append;append();return rows;}
function commissionRows(form){return repeatRows(form,'Commission Received',row=>{field(row,'Amount','commission_amount');const kind=select(row,'Commission Type','commission_type',[['','—'],['1st pase','1st pase'],['2nd pase','2nd pase'],['Variable','Variable']]);kind.required=false;});}
function receivedRows(form,title='Received from Head Office'){return repeatRows(form,title,row=>{field(row,'Amount','received_amount');const via=select(row,title==='Received from Head Office'?'Receive By':'Transfer By','received_via',[['','—'],['bank','Bank'],['person','Person']]);via.required=false;
 const bank=select(row,'Bank Name','received_bank',[['','-- Bank Name --'],...banks.map(x=>[x,x])]);bank.required=false;const person=field(row,'Person Name','received_person','text');person.maxLength=100;
 const update=()=>{bank.closest('.field').hidden=via.value!=='bank';person.closest('.field').hidden=via.value!=='person';};via.onchange=update;update();});}
function collectCommissions(rows){return [...rows.children].map(row=>({amount:amount(row.querySelector('[name=commission_amount]').value),type:row.querySelector('[name=commission_type]').value})).filter(x=>{if(x.amount>0&&!x.type)throw Error('Commission Type নির্বাচন করুন।');return x.amount>0;});}
function collectReceived(rows){return [...rows.children].map(row=>{const n=amount(row.querySelector('[name=received_amount]').value),via=row.querySelector('[name=received_via]').value,bankName=row.querySelector('[name=received_bank]').value,personName=row.querySelector('[name=received_person]').value.trim();if(n>0&&(!via||(via==='bank'&&!bankName)||(via==='person'&&!personName)))throw Error('Head Office transfer-এর Bank বা Person-এর নাম দিন।');return {amount:n,via,bankName:via==='bank'?bankName:'',personName:via==='person'?personName:''};}).filter(x=>x.amount>0);}
function routeFields(form,prefix,title){const grid=section(form,title);const amount=field(grid,'Amount',prefix+'_amount');const via=select(grid,prefix==='headReceive'?'Receive By':'Transfer By',prefix+'_via',[['','—'],['bank','Bank'],['person','Person']]);
 const bank=select(grid,'Bank Name',prefix+'_bank',[['','-- Bank Name --'],...banks.map(x=>[x,x])]);const person=field(grid,'Person Name',prefix+'_person','text');person.maxLength=100;
 const update=()=>{bank.closest('.field').hidden=via.value!=='bank';person.closest('.field').hidden=via.value!=='person';};via.onchange=update;update();return {amount,via,bank,person};}
function amount(value){const raw=String(value??'').trim().replace(/[০-৯]/g,c=>String('০১২৩৪৫৬৭৮৯'.indexOf(c))).replace(/,/g,'');if(raw&&!/^(?:\d+\.?\d*|\.\d+)$/.test(raw))throw Error('সঠিক টাকার অঙ্ক লিখুন।');const n=Number(raw||0);if(!Number.isFinite(n)||n<0||n>1e12)throw Error('Amount ০ বা তার বেশি হতে হবে।');return Math.round(n*100)/100;}
function collectBank(form,prefix){return Object.fromEntries(banks.map(bank=>[bank,amount(form.elements[`${prefix}_${bank}`].value)]));}
function collectRoute(form,prefix){const n=amount(form.elements[prefix+'_amount'].value),via=form.elements[prefix+'_via'].value;
 const bankName=form.elements[prefix+'_bank'].value,personName=form.elements[prefix+'_person'].value.trim();
 if(n>0 && (!via || (via==='bank'&&!bankName) || (via==='person'&&!personName)))throw Error('Head Office-এর Bank বা Person-এর নাম নির্বাচন/লিখুন।');
 return {amount:n,via:n?via:'',bankName:n&&via==='bank'?bankName:'',personName:n&&via==='person'?personName:''};

function selectedDateDsoTotals(legacy,ledger,selectedDate){
 const reports=new Map();
 for(const [key,report] of Object.entries(legacy||{})){
  if(report?.date===selectedDate && /^(80[1-9]|8[1-3][0-9]|84[0-5])$/.test(String(report.userId||'')))reports.set(String(report.userId),report);
 }
 for(const account of Object.values(ledger||{})){
  if(account?.date!==selectedDate)continue;
  const uid=String(account.userId||account.report?.userId||'');
  if(!/^(80[1-9]|8[1-3][0-9]|84[0-5])$/.test(uid))continue;
  // Canonical migration data replaces the archived legacy report, including deletion.
  reports.delete(uid);
  if(account.report)reports.set(uid,account.report);
 }
 const moneyValue=value=>{const n=Number(String(value??0).replace(/,/g,''));if(!Number.isFinite(n))throw Error('DSO B2B amount সঠিক নয়।');return Math.round(n*100);};
 let received=0,sent=0;for(const report of reports.values()){received+=moneyValue(report.emReturn);sent+=moneyValue(report.emReceived);}
 return {receive:received/100,send:sent/100,count:reports.size};
}

(function(){
