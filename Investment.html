<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investment · Collection Portal</title>
<meta name="investment-release-version" content="2026.09.25.25">
<style>
:root{--teal:#00695c;--deep:#004d40;--light:#e0f2f1;--ink:#17342e;--muted:#58736b;--line:#d9e8e3;--canvas:#f4f7f6;--white:#fff;--focus:#00897b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:14px/1.5 'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:14px;background:var(--canvas);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.investment-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:25px 28px;border-radius:16px;background:linear-gradient(125deg,#004d40 0%,#00695c 58%,#00897b 100%);box-shadow:0 12px 32px rgba(0,77,64,.16);color:white}
.investment-hero::after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-75px;top:-100px;background:rgba(255,255,255,.06);pointer-events:none}
.investment-hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#b7ded6}
.investment-hero h1{font-size:clamp(23px,4vw,32px);line-height:1.2;margin:7px 0 6px;color:white}
.investment-hero p{max-width:660px;margin:0;color:#def5ef;font-size:13px}
.hero-icon{font-size:42px;line-height:1;background:rgba(255,255,255,.12);padding:16px;border:1px solid rgba(255,255,255,.16);border-radius:18px}
#access{margin:16px 0;background:#fff3e0;border:1px solid #ffe0b2;color:#8e5400;padding:12px;border-radius:9px}
.menu{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
#moduleMenu{position:sticky;top:0;z-index:20;margin-top:0;background:white;padding:10px;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 12px rgba(4,64,52,.09)}
#moduleMenu button{font-size:14px;padding:12px 16px}
#menu{background:#eaf5f1;border:1px solid #c4e1d8;padding:10px;border-radius:11px;margin-top:0}
.menu button{background:#fff;color:var(--deep);border:1px solid #c7dfd9;border-radius:9px;padding:9px 13px;font-weight:750;transition:background .15s,border .15s,transform .15s}
.menu button:hover{background:#edf8f5;border-color:var(--focus);transform:translateY(-1px)}
.menu button.active{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 4px 9px rgba(0,105,92,.16)}
.nav-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:11px;padding:8px 10px;box-shadow:0 2px 8px rgba(4,64,52,.035)}
.nav-group strong{color:var(--deep);font-size:12px;background:var(--light);padding:7px 9px;border-radius:7px}
.nav-group{display:block;min-width:min(100%,260px);padding:6px}
.nav-group .menu-parent{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;background:transparent;color:var(--deep);box-shadow:none;text-align:left;padding:10px 12px}
.nav-group .menu-parent:hover{background:var(--light);transform:none}
.nav-group .menu-parent[aria-expanded="true"]{background:var(--light)}
.nav-group .submenu{display:grid;gap:5px;padding:5px 7px 7px}
.nav-group .submenu button{width:100%;text-align:left;padding:9px 11px}
.report-filter{display:flex;flex-wrap:wrap;align-items:end;gap:10px;background:#f1f8f5;border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:12px}
.report-filter label{font-weight:700;color:var(--deep)}
.report-filter input{min-height:40px;border:1px solid #b8ccc6;border-radius:8px;padding:8px 10px;background:#fff}
.report-filter button{border:1px solid #8cbbb0;border-radius:8px;padding:9px 12px;background:white;color:var(--deep);font-weight:800}
.report-filter button.active{background:var(--teal);color:white}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:20px;margin:13px 0;box-shadow:0 5px 20px rgba(8,62,54,.055)}
.card h2{margin:0 0 15px;color:var(--deep);font-size:19px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field label,.fields label,.card>label{display:block;font-size:12px;font-weight:750;color:#34574f;margin-bottom:5px}
.field input,.field select,.fields input,.fields select,.card>input{width:100%;min-height:40px;background:#fff;color:var(--ink);border:1px solid #b8ccc6;border-radius:8px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.fields input:focus,.fields select:focus,.card>input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(0,137,123,.12)}
.working-level{border:2px solid #a7d8cb;background:#f8fcfb;border-radius:13px;padding:14px;margin:18px 0}
.working-level>legend{font-size:17px;color:var(--deep);font-weight:900;padding:0 9px}
.closing-level{border-color:#bdd6ba;background:#f9fcf8}.closing-level>legend{color:#2e6637}
.finance-section{border:1px solid #d6e7e2;background:#fff;border-radius:10px;margin:12px 0;padding:12px}
.finance-section legend{font-size:13px;font-weight:800;color:var(--teal);padding:0 7px}
.add-row{background:#ecf7f4;color:var(--teal);border:1px solid #a3cfc3;border-radius:8px;padding:9px 11px;font-weight:750}
.add-row:hover{background:#d7eee8}
.repeat-row{align-items:end;border-bottom:1px solid var(--line);padding:9px 0}.repeat-row>.add-row{align-self:end}
button.save{display:inline-flex;justify-content:center;align-items:center;min-width:190px;background:var(--teal);border:0;color:white;border-radius:9px;padding:12px 22px;font-weight:800;box-shadow:0 5px 12px rgba(0,105,92,.16);margin-top:10px}
button.save:hover{background:var(--deep)}button:disabled{opacity:.55;cursor:wait}
.clear-investment-data{margin-left:auto;border:1px solid #bd4949!important;color:#a31515!important;background:#fff5f5!important}.clear-investment-data:hover{background:#ffe4e4!important}
#investMessage,#bankMessage{min-height:20px;font-weight:700;color:#b71c1c;margin:12px 0 0}
.balance{display:block;font-weight:800;color:var(--deep);background:var(--light);border:1px solid #beddd5;padding:12px;border-radius:9px}
.difference-total.balance-mismatch{border-color:#db8989;background:#fff2f2}.difference-total.balance-mismatch input{color:#a31515;font-weight:800}
.report-difference{background:#ffe8e8;color:#a31515;font-weight:900}.capital-report-table th{white-space:nowrap}.capital-report-table td{white-space:nowrap}.capital-report-table td:last-child{white-space:normal;min-width:240px}
.report-detail-button{border:1px solid #9bcbbb;background:#e9f7f1;color:var(--deep);border-radius:7px;padding:7px 10px;font-weight:800}.report-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.report-detail-grid section{padding:12px;border:1px solid var(--line);border-radius:9px;background:white}.report-detail-grid h4{margin:0 0 7px;color:var(--deep)}.report-detail-grid p{margin:4px 0}
.scroll{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;min-width:680px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e1ece8;font-size:12px}th{background:#e8f5f1;color:var(--deep);font-weight:800;position:sticky;top:0}tbody tr:nth-child(even){background:#f9fcfb}tbody tr:hover{background:#eff8f5}
/* Opening and Closing use separate visual cues throughout the form. */
body{overflow-x:hidden}main,#content,#bankContent,form,fieldset,.field,.fields>*{min-width:0;max-width:100%}
.opening-level{border:2px solid #80bbdc;background:#edf7fd;box-shadow:inset 4px 0 0 #1573a6,0 7px 20px rgba(27,112,161,.07)}
.opening-level>legend{color:#105a80;background:#e3f2fb;border:1px solid #aed5eb;border-radius:8px;padding:5px 13px}
.opening-level .finance-section{border-color:#bdddee;background:#fbfdff}
.opening-level .finance-section legend{color:#14648d}
.closing-level{border:2px solid #e5ba78;background:#fff8ed;box-shadow:inset 4px 0 0 #bf7b21,0 7px 20px rgba(171,109,30,.07)}
.closing-level>legend{color:#875115;background:#fff0d7;border:1px solid #e8c392;border-radius:8px;padding:5px 13px}
.closing-level .finance-section{border-color:#efd9b5;background:#fffdfa}
.closing-level .finance-section legend{color:#965e18}
.opening-total{border:1px solid #a5cfe7;background:#eff8fe}.closing-total{border:1px solid #e9c690;background:#fff5e5}
.opening-total input,.closing-total input,.difference-total input{font-size:17px;font-weight:850}
.menu button,.add-row,.report-detail-button{min-height:42px}.field input,.field select,.fields input,.fields select{min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2489b4;outline-offset:2px}
.scroll{max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.scroll table{min-width:680px}.capital-report-table{min-width:1380px}
.report-detail-grid section{overflow-wrap:anywhere}
@media(max-width:800px){#moduleMenu{position:relative;top:auto}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.repeat-row{grid-template-columns:repeat(2,minmax(0,1fr))}.repeat-row>.add-row{grid-column:1/-1}.report-filter>*{min-width:0}}
@media(max-width:560px){body{padding:8px}.card{padding:14px;margin:10px 0}.working-level{padding:10px;margin:15px 0}.finance-section{padding:10px}.fields,.repeat-row,.report-detail-grid{grid-template-columns:minmax(0,1fr)}#moduleMenu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:8px}#moduleMenu button{width:100%;padding:10px 6px;font-size:12px;white-space:normal}.clear-investment-data{grid-column:1/-1;margin-left:0}.nav-group{width:100%}.nav-group strong{width:100%}.report-filter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.report-filter input{width:100%}.report-filter button{min-width:0}button.save{width:100%}.card h2{font-size:17px}}
@media(max-width:360px){#moduleMenu{grid-template-columns:1fr}.report-filter{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.menu button,.field input,.field select{transition:none}}
</style></head><body><p id="access" hidden></p><nav id="moduleMenu" class="menu" aria-label="Investment main navigation" hidden><button type="button" id="showWorkingCapital" class="active">💼 Working Capital</button><button type="button" id="showPettyCash">💵 Petty Cash</button><button type="button" id="showTotalInvestment">📊 Total Investment</button><button type="button" id="showBank">🏦 Bank</button><button type="button" id="clearInvestmentData" class="clear-investment-data" hidden>🗑 পরীক্ষার ডাটা পরিষ্কার</button></nav><main id="app" hidden><nav id="menu" class="menu" aria-label="Investment submenu"></nav><section id="content"></section></main><p id="bankAccess" hidden></p><main id="bankApp" hidden><nav id="bankMenu" class="menu"></nav><section id="bankContent"></section></main>
<script>
// All Investment form, Working Capital reports and Petty Cash accounting live here.
(()=>{'use strict';
let bridge;
try{bridge=parent!==window && parent.location.origin===location.origin && parent.portalInvestmentContext;}catch(_){bridge=null;}
const preview=!bridge?.database || !bridge.getUser();
if(preview)bridge={database:null,getUser:()=>null,serverTimestamp:null};
const owner=preview?'preview':String(bridge.getUser());
const database=bridge.database,menu=document.getElementById('menu'),content=document.getElementById('content');
document.getElementById('access').hidden=true;document.getElementById('app').hidden=false;
const banks=['Islami','Pubali','City','DBBL','Agroni','UCB','Sonali'];
const pages=[['capital','Daily Working Capital'],['capitalReport','Working Capital Report'],['petty','Daily Petty Cash'],['pettyReport','Daily Petty Cash Report'],['total','Total Investment']];
let page='capital',items={},stream=null,handler=null;
const node=(tag,label)=>{const x=document.createElement(tag);if(label!==undefined)x.textContent=String(label);return x;};
const money=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function today(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=key=>parts.find(x=>x.type===key).value;return `${part('year')}-${part('month')}-${part('day')}`;}
function stop(){if(stream){stream.off('value',handler);stream=null;handler=null;}}
function field(area,label,name,type='number',required=false){
 const box=node('div');box.className='field';box.append(node('label',label));const input=node('input');input.name=name;input.type=type==='number'?'text':type;input.required=required;
 if(type==='number'){input.inputMode='decimal';input.addEventListener('blur',()=>{if(input.value.trim()){try{input.value=money(amount(input.value));}catch{input.setCustomValidity('সঠিক টাকার অঙ্ক লিখুন।');input.reportValidity();}}});input.addEventListener('input',()=>input.setCustomValidity(''));}
 if(type==='date')input.value=today();box.append(input);area.append(box);return input;
}
function select(area,label,name,options){
 const box=node('div');box.className='field';box.append(node('label',label));const x=node('select');x.name=name;x.required=true;
 options.forEach(([value,caption])=>{const o=node('option',caption);o.value=value;x.append(o);});box.append(x);area.append(box);return x;
}
function section(form,title){const wrap=node('fieldset');wrap.className='finance-section';wrap.append(node('legend',title));const grid=node('div');grid.className='fields';wrap.append(grid);form.append(wrap);return grid;}
function baseFields(form){const grid=section(form,'Date');field(grid,'Date','date','date',true);return grid;}
function bankFields(form,prefix,title){const grid=section(form,title);banks.forEach(bank=>field(grid,bank,`${prefix}_${bank}`));return grid;}
function repeatRows(form,title,createRow){const grid=section(form,title),wrap=grid.parentElement;grid.remove();const rows=node('div');wrap.append(rows);const add=node('button','+ Add More');add.type='button';add.className='add-row';wrap.append(add);
 const append=()=>{const row=node('div');row.className='fields repeat-row';createRow(row);const remove=node('button','Remove');remove.type='button';remove.className='add-row';remove.onclick=()=>{if(rows.children.length>1){row.remove();wrap.dispatchEvent(new Event('input',{bubbles:true}));}};row.append(remove);rows.append(row);wrap.dispatchEvent(new Event('input',{bubbles:true}));};add.onclick=append;append();return rows;}
function commissionRows(form){return repeatRows(form,'Commission Received',row=>{field(row,'Amount','commission_amount');const kind=select(row,'Commission Type','commission_type',[['','-- Select --'],['1st pase','1st pase'],['2nd pase','2nd pase'],['Variable','Variable']]);kind.required=false;});}
function receivedRows(form,title='Received from Head Office'){return repeatRows(form,title,row=>{field(row,'Amount','received_amount');const via=select(row,title==='Received from Head Office'?'Receive By':'Transfer By','received_via',[['','-- নির্বাচন করুন --'],['bank','Bank'],['person','Person']]);via.required=false;
 const bank=select(row,'Bank Name','received_bank',[['','-- Bank Name --'],...banks.map(x=>[x,x])]);bank.required=false;const person=field(row,'Person Name','received_person','text');person.maxLength=100;
 const update=()=>{bank.closest('.field').hidden=via.value!=='bank';person.closest('.field').hidden=via.value!=='person';};via.onchange=update;update();});}
function collectCommissions(rows){return [...rows.children].map(row=>({amount:amount(row.querySelector('[name=commission_amount]').value),type:row.querySelector('[name=commission_type]').value})).filter(x=>{if(x.amount>0&&!x.type)throw Error('Commission Type নির্বাচন করুন।');return x.amount>0;});}
function collectReceived(rows){return [...rows.children].map(row=>{const n=amount(row.querySelector('[name=received_amount]').value),via=row.querySelector('[name=received_via]').value,bankName=row.querySelector('[name=received_bank]').value,personName=row.querySelector('[name=received_person]').value.trim();if(n>0&&(!via||(via==='bank'&&!bankName)||(via==='person'&&!personName)))throw Error('Head Office transfer-এর Bank বা Person-এর নাম দিন।');return {amount:n,via,bankName:via==='bank'?bankName:'',personName:via==='person'?personName:''};}).filter(x=>x.amount>0);}
function routeFields(form,prefix,title){const grid=section(form,title);const amount=field(grid,'Amount',prefix+'_amount');const via=select(grid,prefix==='headReceive'?'Receive By':'Transfer By',prefix+'_via',[['','-- নির্বাচন করুন --'],['bank','Bank'],['person','Person']]);
 const bank=select(grid,'Bank Name',prefix+'_bank',[['','-- Bank Name --'],...banks.map(x=>[x,x])]);const person=field(grid,'Person Name',prefix+'_person','text');person.maxLength=100;
 const update=()=>{bank.closest('.field').hidden=via.value!=='bank';person.closest('.field').hidden=via.value!=='person';};via.onchange=update;update();return {amount,via,bank,person};}
function amount(value){const raw=String(value??'').trim().replace(/,/g,'');if(raw&&!/^(?:\d+\.?\d*|\.\d+)$/.test(raw))throw Error('সঠিক টাকার অঙ্ক লিখুন।');const n=Number(raw||0);if(!Number.isFinite(n)||n<0||n>1e12)throw Error('Amount ০ বা তার বেশি হতে হবে।');return Math.round(n*100)/100;}
function collectBank(form,prefix){return Object.fromEntries(banks.map(bank=>[bank,amount(form.elements[`${prefix}_${bank}`].value)]));}
function collectRoute(form,prefix){const n=amount(form.elements[prefix+'_amount'].value),via=form.elements[prefix+'_via'].value;
 const bankName=form.elements[prefix+'_bank'].value,personName=form.elements[prefix+'_person'].value.trim();
 if(n>0 && (!via || (via==='bank'&&!bankName) || (via==='person'&&!personName)))throw Error('Head Office-এর Bank বা Person-এর নাম নির্বাচন/লিখুন।');
 return {amount:n,via:n?via:'',bankName:n&&via==='bank'?bankName:'',personName:n&&via==='person'?personName:''};
}
function cashBalances(date){let deposits=0,spentBefore=0,spentToday=0;
 Object.values(items).forEach(x=>{if(!x||!x.date||x.scope!=='company')return;
  if(x.type==='capital' && x.date<=date)deposits+=Number(x.transfers?.petty||x.pettyCashTransfer||0);
  if(x.type==='petty' && x.date<date)spentBefore+=Number(x.amount)||0;
  if(x.type==='petty' && x.date===date)spentToday+=Number(x.amount)||0;
 });
 return {opening:Math.round((deposits-spentBefore)*100)/100,available:Math.round((deposits-spentBefore-spentToday)*100)/100};
}
function show(key){stop();page=key;menu.replaceChildren();content.replaceChildren();
 const children=key==='capital'||key==='capitalReport'?
  [['capital','Daily Working Capital'],['capitalReport','Working Capital Report']]:
  key==='petty'||key==='pettyReport'?
  [['petty','Daily Petty Cash'],['pettyReport','Daily Petty Cash Report']]:[];
 menu.hidden=children.length===0;
 children.forEach(([name,label])=>{
  const button=node('button',label);button.type='button';button.classList.toggle('active',name===key);
  button.onclick=()=>show(name);menu.append(button);
 });
 if(key==='capital')capitalForm();else if(key==='petty')pettyForm();else report(key);
 if(preview){items={};render();return;}
 stream=database.ref('investmentEntries');const expected=key;
 handler=snap=>{if(String(bridge.getUser())!==owner||page!==expected)return;items=snap.val()||{};if(page==='capital')window.investmentSyncOpening?.();render();};
 stream.on('value',handler,err=>{const box=document.getElementById('investList');if(box)box.textContent='ডাটা লোড হয়নি: '+err.message;});
}
function card(title){const div=node('div');div.className='card';div.append(node('h2',title));content.append(div);return div;}
function listBox(){const list=node('div');list.id='investList';list.className='card scroll';content.append(list);return list;}
function submitTools(form,card){const save=node('button','Submit');save.className='save';save.type='submit';
 if(preview){save.disabled=true;save.title='Collection Portal-এ Admin login করে Investment menu খুললে Submit চালু হবে।';}
 form.append(save);card.append(form);const status=node('p');status.id='investMessage';card.append(status);return {save,status};}
function capitalForm(){
 const box=card('Daily Working Capital'),form=node('form');form.id='capitalForm';
 const openingLevel=node('fieldset');openingLevel.className='working-level opening-level';openingLevel.append(node('legend','Opening Balance'));form.append(openingLevel);
 let grid=node('div');grid.className='fields';openingLevel.append(grid);field(grid,'MA Wallet','opening_wallet');field(grid,'Cash In Hand','opening_cashHand');field(grid,'Cash In Shivalaya Office','opening_cashOffice');
 bankFields(openingLevel,'openingBank','Bank');
 const commissions=commissionRows(openingLevel),receipts=receivedRows(openingLevel);
 const totalGrid=node('div');totalGrid.className='card fields opening-total';form.append(totalGrid);const openingSum=field(totalGrid,'Total Opening Balance','opening_total','text');openingSum.readOnly=true;openingSum.setAttribute('aria-live','polite');
 const updateDifference=()=>{const output=form.elements.balance_difference;if(!output)return;const difference=Math.round(((Number(openingSum.value.replace(/,/g,''))||0)-(Number(form.elements.closing_total?.value.replace(/,/g,''))||0))*100)/100;output.value=money(difference);output.closest('.card').classList.toggle('balance-mismatch',difference!==0);};
 const updateOpeningSum=()=>{const names=['opening_wallet','opening_cashHand','opening_cashOffice',...banks.map(bank=>`openingBank_${bank}`)];const extra=[...commissions.querySelectorAll('[name=commission_amount]'),...receipts.querySelectorAll('[name=received_amount]')];openingSum.value=money([...names.map(name=>form.elements[name]),...extra].reduce((sum,input)=>sum+(Number(input.value.replace(/,/g,''))||0),0));updateDifference();};
 openingLevel.addEventListener('input',updateOpeningSum);updateOpeningSum();
 const syncOpening=()=>{if(!form.isConnected)return;const prior=Object.values(items).filter(x=>x?.scope==='company'&&x.type==='capital'&&x.date<today()&&x.closing).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const balances=prior?.closing;const pairs=[['opening_wallet',balances?.maWallet],['opening_cashHand',balances?.cashInHand],['opening_cashOffice',balances?.cashInOffice],...banks.map(bank=>[`openingBank_${bank}`,balances?.banks?.[bank]])];
  pairs.forEach(([name,value])=>{const input=form.elements[name];if(!prior&&input.readOnly)input.value='';input.readOnly=!!prior;if(prior)input.value=money(Number(value)||0);});updateOpeningSum();};
 window.investmentSyncOpening=syncOpening;syncOpening();
 const closingLevel=node('fieldset');closingLevel.className='working-level closing-level';closingLevel.append(node('legend','Closing Balance'));form.append(closingLevel);
 grid=node('div');grid.className='fields';closingLevel.append(grid);field(grid,'MA Wallet','closing_wallet');field(grid,'Cash In Hand','closing_cashHand');field(grid,'Cash In Shivalaya','closing_cashOffice');
 bankFields(closingLevel,'closingBank','Bank');
 const headTransfers=receivedRows(closingLevel,'Cash Transfer to Head Office');
